<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Dinamis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="calender">
                <div class="month">
                    <i class="fa fa-angle-left prev"></i>
                    <div class="date">September 2026</div>
                    <i class="fa fa-angle-right next"></i>
                </div>
                <div class="weekdays">
                    <div class="day">Senin</div>
                    <div class="day">Selasa</div>
                    <div class="day">Rabu</div>
                    <div class="day">Kamis</div>
                    <div class="day">Jumat</div>
                    <div class="day">Sabtu</div>
                    <div class="day">Minggu</div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
